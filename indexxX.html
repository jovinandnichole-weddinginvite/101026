<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invitation Card</title>

<style>
#bg {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    background: radial-gradient(ellipse at center, #ffffff 40%, #bbbbbb 100%);
}

.contact {
    position: absolute;
    left: 50%;
    top: 50%;
    margin-left: -125px;
    margin-top: -125px;
    height: 0;
    width: 90px;
    background: rgba(0, 0, 0, 0.1);
    border-radius: 2px;
    transform: scale(4);
    transform-origin: center;
}

.contact .envelope {
    position: absolute;
    height: 94px;
    width: 161px;
    left: 50%;
    margin-left: -83px;
    top: 50%;
    background: #F9F9F9;
    transition: margin-top 300ms;
}

.contact:hover .envelope,
#openCard:checked + .contact .envelope {
    margin-top: 20px;
}

.contact .envelope .top {
    position: absolute;
    width: 100%;
    height: 70px;
    z-index: 40;
    transform-origin: top;
    transition: transform 300ms;
}

.contact:hover .envelope .top,
#openCard:checked + .contact .envelope .top {
    height: 0;
    top: -60px;
    transform: rotateX(180deg);
}

.contact .envelope .outer {
    position: absolute;
    bottom: 0;
    left: 0;
    border-left: 83px solid transparent;
    border-right: 82px solid transparent;
    border-top: 70px solid #EEE;
}

.contact .envelope .outer .inner {
    position: absolute;
    left: -81px;
    top: -73px;
    border-left: 81px solid transparent;
    border-right: 80px solid transparent;
    border-top: 68px solid #333;
}

.contact .envelope .bottom {
    position: absolute;
    z-index: 20;
    bottom: 0;
    left: 0;
    border-left: 81px solid transparent;
    border-right: 80px solid transparent;
    border-bottom: 45px solid #333;
}

.contact .envelope .left {
    position: absolute;
    z-index: 20;
    border-left: 81px solid #333;
    border-top: 45px solid transparent;
    border-bottom: 45px solid transparent;
}

.contact .envelope .right {
    position: absolute;
    z-index: 20;
    right: 0;
    border-right: 80px solid #333;
    border-top: 45px solid transparent;
    border-bottom: 45px solid transparent;
}

.contact .envelope .cover {
    position: absolute;
    z-index: 15;
    bottom: 0;
    height: 55%;
    width: 100%;
    background: #EEE;
}

.contact .envelope .paper {
    position: absolute;
    height: 83px;
    padding-top: 10px;
    width: 100%;
    background: #F9F9F9;
    z-index: 10;
    transition: margin-top 300ms;
}

.contact:hover .envelope .paper,
#openCard:checked + .contact .envelope .paper {
    margin-top: -60px;
}

.contact .envelope .paper a {
    display: block;
    font-size: 14px;
    margin: 5px;
    text-align: center;
    color: #333;
    text-decoration: none;
}

.contact .envelope .paper a:hover {
    color: #EEE;
}
</style>

</head>

<body>

<div id="bg"></div>
<input type="checkbox" id="openCard" hidden>

<label for="openCard" class="contact">
    <div class="envelope">
        <div class="top">
            <div class="outer">
                <div class="inner"></div>
            </div>
        </div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
        <div class="cover"></div>
        <div class="paper">
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">
                    View Invitation
                </a>
            </div>
        </div>
    </div>
</label>

</body>
</html>
