  position: fixed;

  z-index: 9999;
}

@keyframes noteFloat {
  from {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
  to {
    opacity: 0;
    transform: translate(-20px, -120px) scale(1.3);

  0% { transform: rotate(0); }

<script>
const fullscreen = document.getElementById("fullscreenGallery");
const fullscreenImg = document.getElementById("fullscreenImg");
const closeBtn = document.getElementById("closeFullscreen");

const slideImages = document.querySelectorAll(".slides img");

let fullscreenIndex = 0;

/* ✅ OPEN */
slideImages.forEach((img, i) => {
  img.addEventListener("click", () => {
    fullscreenIndex = i;
    fullscreen.classList.add("active");
    updateFullscreen();
  });
});

/* ✅ UPDATE */
function updateFullscreen() {
  fullscreenImg.src = slideImages[fullscreenIndex].src;
}

/* ✅ NAVIGATION FUNCTIONS */
function nextSlide() {
  fullscreenIndex = (fullscreenIndex + 1) % slideImages.length;
  updateFullscreen();
}

function prevSlide() {
  fullscreenIndex = (fullscreenIndex - 1 + slideImages.length) % slideImages.length;
  updateFullscreen();
}

/* ✅ CLOSE */
closeBtn.addEventListener("click", () => {
  fullscreen.classList.remove("active");
});

/* ✅ ESC */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") fullscreen.classList.remove("active");
});

/* ✅ SWIPE FIX (REAL SWIPE) */
let touchStartX = 0;

fullscreen.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
});

fullscreen.addEventListener("touchend", (e) => {
  let touchEndX = e.changedTouches[0].clientX;
  let diff = touchStartX - touchEndX;

  if (Math.abs(diff) > 50) {  // ✅ threshold prevents accidental taps
    if (diff > 0) {
      nextSlide();   // swipe left
    } else {
      prevSlide();   // swipe right
    }
  }
});

/* ✅ CLICK LEFT / RIGHT (desktop support) */
fullscreen.addEventListener("click", (e) => {
  if (e.target === fullscreenImg) {
    const clickX = e.clientX;

    if (clickX < window.innerWidth / 2) {
      prevSlide();
    } else {
      nextSlide();
    }
  }
});
</script>

<script>
const slides = document.querySelectorAll(".slides img");

let index = 0;

/* ✅ show first image */
slides[index].classList.add("active");

/* ✅ AUTO FADE SLIDE */
function autoSlide() {
  // remove current
  slides[index].classList.remove("active");

  // next index
  index = (index + 1) % slides.length;

  // show next
  slides[index].classList.add("active");
}

/* ✅ RUN EVERY 4.5s */
let slideInterval = setInterval(autoSlide, 4500);

/* ✅ PAUSE ON HOVER */
const slider = document.querySelector(".gallery-slider");

slider.addEventListener("mouseenter", () => {
  clearInterval(slideInterval);
});

slider.addEventListener("mouseleave", () => {
  slideInterval = setInterval(autoSlide, 4500);
});
</script>
